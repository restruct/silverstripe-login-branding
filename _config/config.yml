---
Name: admin-branding
Before:
  - '#login-forms'
---
SilverStripe\LoginForms\EnablerExtension:
  login_themes:
    # insert before themes in vendor/silverstripe/login-forms/_config/theme.yml
    - 'restruct/silverstripe-login-branding:login-forms'
  excluded_actions:
    # The expired-notice token check (SecurityBrandingExtension::checktoken()) answers JSON and
    # renders no page, so login-forms has no reason to switch themes for it.
    - 'checktoken'

SilverStripe\Security\Security:
  extensions:
    - 'Restruct\SilverStripe\AdminBranding\SecurityBrandingExtension'

---
Name: admin-branding-siteconfig
Only:
  moduleexists: 'silverstripe/siteconfig'
---
SilverStripe\SiteConfig\SiteConfig:
  extensions:
    - Restruct\SilverStripe\AdminBranding\SiteConfigBrandingExtension
